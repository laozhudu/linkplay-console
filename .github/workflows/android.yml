name: android-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # secrets 不能直接出现在 if: 里（GitHub 会判 workflow 无效），先落到 env 再判断
    env:
      KEYSTORE_B64: ${{ secrets.LINKPLAY_KEYSTORE_B64 }}
      LINKPLAY_STORE_PASSWORD: ${{ secrets.LINKPLAY_STORE_PASSWORD }}
      LINKPLAY_KEY_ALIAS: ${{ secrets.LINKPLAY_KEY_ALIAS }}
      LINKPLAY_KEY_PASSWORD: ${{ secrets.LINKPLAY_KEY_PASSWORD }}

    steps:
      # fetch-depth: 0 是必需的，不要改成默认的 1。
      # versionCode 取自 git 提交数，浅克隆下永远是 1，包版本不会递增，覆盖安装再次失效。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名密钥：不配置这一步，runner 会现造 ~/.android/debug.keystore，
      # 每个包的签名都不同，Android 会拒绝覆盖安装（INSTALL_FAILED_UPDATE_INCOMPATIBLE）。
      - name: Restore signing keystore
        if: env.KEYSTORE_B64 != ''
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keys/release.jks"
          test -s "$RUNNER_TEMP/keys/release.jks" || { echo "keystore 解码为空"; exit 1; }
          echo "LINKPLAY_KEYSTORE=$RUNNER_TEMP/keys/release.jks" >> "$GITHUB_ENV"

      # 版本号：main 用自身提交数（每次 squash 合并 +1，单调递增）；
      # PR 用「目标分支当前提交数」，否则 PR 分支提交多、合并后变少，会出现降级安装。
      - name: Resolve versionCode
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            CODE=$(git rev-list --count "origin/$GITHUB_BASE_REF")
          else
            CODE=$(git rev-list --count HEAD)
          fi
          echo "本次 versionCode = $CODE"
          echo "LINKPLAY_VERSION_CODE=$CODE" >> "$GITHUB_ENV"

      # init 块必须写在所有类级属性之后。Kotlin 按声明顺序初始化，
      # init 里启动的协程可能在后面字段还是 null 时就访问它们 —— 编译器不报、单测测不到。
      # 真实事故见 scripts/check-init-order.py 的文档注释。
      - name: Check init block ordering
        run: python3 scripts/check-init-order.py

      # 诊断标签必须能对上"用户点了什么"。类名式标签（ConsoleViewModel）和占位词（log/run/act）
      # 等于把行号换了个地方写，看报告时定位不到具体动作。
      # 真实事故：一次批量替换把 4 个心跳协程全写成 acquireMulticastLock。
      - name: Check diagnostics labels
        run: python3 scripts/check-diagnostics-labels.py

      # 动作耗时账本按"动作名"聚合。名字漂移会让同一件事在报告里变成两条，
      # 于是"平均 240ms"和"最慢 610ms"都不再代表那个动作。名字现在是枚举，
      # 这里查类型系统管不到的两件事：id 规范 + 每个动作是否真的接上了。
      # 真实事故见 scripts/check-timing-names.py 的文档注释。
      - name: 检查动作耗时账本的动作名
        run: python3 scripts/check-timing-names.py

      # 三个模块都要跑：诊断能力是独立的纯 JVM 库，它的测试不该依赖 Android。
      - name: Unit tests
        run: ./gradlew --no-daemon :core-protocol:test :core-diagnostics:test :core-script:test :core-upnp:test :core-radio:test :core-lx:testDebugUnitTest :app:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      # 把「包身份」写进构建日志：以后排查覆盖安装问题时，
      # 一眼就能看出两次构建的签名指纹是否一致、版本号是否递增。
      - name: Report APK identity
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* 2>/dev/null | sort -V | tail -1)
          echo "### APK 身份" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:" | tee -a "$GITHUB_STEP_SUMMARY"
          "$BT/apksigner" verify --print-certs "$APK" \
            | grep -E "certificate (DN|SHA-256)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: linkplay-console-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            core-protocol/build/reports/tests/test
            core-diagnostics/build/reports/tests/test
          if-no-files-found: warn
